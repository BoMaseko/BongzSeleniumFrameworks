#environment which test needs to run
#values can be {zapre, corepre, prod, etc}
environment=zapre

#AdminWebURL
//zapre.url=https://homeassistant.maseko-lab.xyz/home/overview
zapre.url=https://homeassistant.maseko-lab.xyz/home/overview
corepre.url=https://homeassistant.maseko-lab.xyz/home/overview



#Dynamic reports yes or no
#if no, report will have name as currenttime+index.html
#if yes, report will have name as index.html
overridereports=yes

#passed step screenshot
passedstepscreenshot=yes

#failed step screenshot
failedstepscreenshot=yes

#skipped step screenshot
skippedstepscreenshot=yes

#retry 2 times
retryfailedtests=no

#Runmode local or remote or selenoid
runmode=remote

#send results to ELK(Live Dashboard) --> yes or no
sendresultstoelk=no

#sendEmail --> yes or no 
#if yes it will send results report???????
sendemailreport=no

#selenium grid url
seleniumgridurl=http://selenium.maseko-lab.xyz

#elastic url
elasticurl = http://localhost:9200/suite/results

sendCustomerChatUrl = https://scc-hybrid-chat-cim-qa.fnb.co.za/ef-chat/fnb-cme/send-message/v1
